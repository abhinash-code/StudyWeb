<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Manager - Account Creation</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-color: #374151;
            --text-light: #6b7280;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --error-color: #ef4444;
            --success-color: #10b981;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.2s ease;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #e5e7eb;
                --text-light: #9ca3af;
                --bg-color: #111827;
                --card-bg: #1f2937;
                --border-color: #374151;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px;
            width: 100%;
        }

        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo svg {
            width: 48px;
            height: 48px;
            color: var(--primary-color);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 16px;
            background-color: var(--card-bg);
            color: var(--text-color);
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 4px;
        }

        .toggle-password:hover {
            color: var(--text-color);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        .password-strength {
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-meter {
            height: 100%;
            width: 0;
            transition: var(--transition);
        }

        .password-feedback {
            font-size: 14px;
            margin-top: 6px;
            min-height: 20px;
        }

        .feedback-error {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 6px;
            display: flex;
            align-items: center;
        }

        .feedback-error svg {
            margin-right: 6px;
            width: 16px;
            height: 16px;
        }

        .button {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .button:hover {
            background-color: var(--primary-hover);
        }

        .button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .button svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 32px 0;
            position: relative;
        }

        .divider-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--card-bg);
            padding: 0 12px;
            font-size: 14px;
            color: var(--text-light);
        }

        .text-button {
            background: none;
            border: none;
            color: var(--primary-color);
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .text-button:hover {
            color: var(--primary-hover);
        }

        .alert {
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            display: flex;
        }

        .alert-warning {
            background-color: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .alert-warning svg {
            margin-right: 12px;
            flex-shrink: 0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M75 30H25C20 30 15 35 15 40V80C15 85 20 90 25 90H75C80 90 85 85 85 80V40C85 35 80 30 75 30Z" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M75 30V40C75 45 70 50 65 50H35C30 50 25 45 25 40V30" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M50 65H35" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M65 75H35" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            
            <h1>Create New Account</h1>
            <p class="subtitle">Set up a local encrypted vault for your documents</p>
            
            <div id="warningAlert" class="alert alert-warning">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <div>
                    <strong>Local storage warning:</strong> Your data will only be stored in this browser. 
                    Without a recovery file, lost passwords result in permanent data loss.
                </div>
            </div>
            
            <form id="accountForm">
                <div class="form-group">
                    <label for="accountName">Account Name</label>
                    <input type="text" id="accountName" name="accountName" required autocomplete="off">
                    <div id="nameError" class="feedback-error hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <span id="nameErrorText"></span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email (Optional)</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="masterPassword">Master Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="masterPassword" name="masterPassword" required autocomplete="new-password">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-meter" id="passwordStrengthMeter"></div>
                    </div>
                    <div class="password-feedback" id="passwordFeedback"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
                        <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Show password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div id="confirmError" class="feedback-error hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <span>Passwords do not match</span>
                    </div>
                </div>
                
                <button type="submit" class="button" id="createButton" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Create Account
                </button>
            </form>
            
            <div class="divider">
                <span class="divider-text">Or</span>
            </div>
            
            <div style="text-align: center;">
                <button type="button" class="text-button" id="importButton">
                    Import existing account from backup
                </button>
            </div>
        </div>
    </div>
   <script src="app.js"></script>
   <script src="schema.js"></script>
  <script src="core.js"></script>
  <script src="server.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Password visibility toggles
            const togglePassword = document.getElementById('togglePassword');
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
            const masterPassword = document.getElementById('masterPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            
            togglePassword.addEventListener('click', function() {
                const type = masterPassword.getAttribute('type') === 'password' ? 'text' : 'password';
                masterPassword.setAttribute('type', type);
                this.setAttribute('aria-label', type === 'password' ? 'Show password' : 'Hide password');
            });
            
            toggleConfirmPassword.addEventListener('click', function() {
                const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPassword.setAttribute('type', type);
                this.setAttribute('aria-label', type === 'password' ? 'Show password' : 'Hide password');
            });
            
            // Password strength meter
            const passwordStrengthMeter = document.getElementById('passwordStrengthMeter');
            const passwordFeedback = document.getElementById('passwordFeedback');
            
            masterPassword.addEventListener('input', function() {
                checkPasswordStrength(this.value);
                validateForm();
            });
            
            confirmPassword.addEventListener('input', validateForm);
            document.getElementById('accountName').addEventListener('input', validateForm);
            
            function checkPasswordStrength(password) {
                // Simplified strength calculation (would use zxcvbn in production)
                let strength = 0;
                let message = '';
                
                if (password.length === 0) {
                    passwordStrengthMeter.style.width = '0%';
                    passwordStrengthMeter.style.backgroundColor = '';
                    passwordFeedback.textContent = '';
                    return;
                }
                
                if (password.length < 8) {
                    strength = 1;
                    message = 'Too short';
                } else {
                    // Check for character variety
                    const hasLower = /[a-z]/.test(password);
                    const hasUpper = /[A-Z]/.test(password);
                    const hasNumbers = /\d/.test(password);
                    const hasSpecial = /[^A-Za-z0-9]/.test(password);
                    
                    const varietyCount = [hasLower, hasUpper, hasNumbers, hasSpecial].filter(Boolean).length;
                    
                    if (varietyCount < 2) {
                        strength = 2;
                        message = 'Weak';
                    } else if (varietyCount < 4) {
                        strength = 3;
                        message = 'Medium';
                    } else {
                        strength = 4;
                        message = 'Strong';
                    }
                }
                
                // Update UI
                const percent = strength * 25;
                passwordStrengthMeter.style.width = percent + '%';
                
                if (strength <= 1) {
                    passwordStrengthMeter.style.backgroundColor = '#ef4444'; // red
                } else if (strength <= 2) {
                    passwordStrengthMeter.style.backgroundColor = '#f59e0b'; // orange
                } else if (strength <= 3) {
                    passwordStrengthMeter.style.backgroundColor = '#84cc16'; // lime
                } else {
                    passwordStrengthMeter.style.backgroundColor = '#10b981'; // green
                }
                
                passwordFeedback.textContent = message;
            }
            
            function validateForm() {
                const name = document.getElementById('accountName').value;
                const password = masterPassword.value;
                const confirm = confirmPassword.value;
                
                // Check if passwords match
                const passwordsMatch = password === confirm;
                document.getElementById('confirmError').classList.toggle('hidden', passwordsMatch || confirm === '');
                
                // Enable button only if form is valid
                const isValid = name.length > 0 && 
                              password.length >= 8 && 
                              passwordsMatch;
                              
                document.getElementById('createButton').disabled = !isValid;
                
                return isValid;
            }
            
            // Form submission
            document.getElementById('accountForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (!validateForm()) return;
                
                // In a real implementation, this would:
                // 1. Check if account name is unique in IndexedDB
                // 2. Generate salt and derive master key
                // 3. Create verifier and store user record
                // 4. Prompt for recovery file creation
                
                alert('Account creation would proceed here. This is a frontend prototype.');
            });
            
            // Import button
            document.getElementById('importButton').addEventListener('click', function() {
                alert('Import functionality would be implemented here.');
            });
        });
    </script>
</body>
</html>
