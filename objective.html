<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Subject</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #232526, #414345);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 40px;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
    }

    .subject-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      width: 450px;
      max-width: 90%;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      transition: background 0.3s ease;
    }

    .row:last-child {
      border-bottom: none;
    }

    .row:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .subject {
      font-size: 1.3rem;
      font-weight: 600;
      color: #00d0ff;
    }

    .link a {
      text-decoration: none;
      color: #ff5252;
      font-weight: bold;
      transition: color 0.3s;
    }

    .link a:hover {
      color: #fff200;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 2rem;
      }

      .subject-box {
        width: 95%;
      }

      .row {
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <h1>Choose Your Subject</h1>
  <div class="subject-box">
    <div class="row">
      <div class="subject">Physics</div>
      <div class="link"><a href="Physics_Objective.html">Click here</a></div>
    </div>
    <div class="row">
      <div class="subject">Chemistry</div>
      <div class="link"><a href="chemistry_Objective.html">Click here</a></div>
    </div>
    <div class="row">
      <div class="subject">Mathematics</div>
      <div class="link"><a href="Maths_Objecitve.html">Click here</a></div>
    </div>
    <div class="row">
      <div class="subject">Biology</div>
      <div class="link"><a href="Biology_Objective.html">Click here</a></div>
    </div>
  </div>
</body>
</html>
