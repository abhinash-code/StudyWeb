<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - FinancePro</title>
    <meta name="description" content="Secure payment processing for FinancePro services. Multiple payment methods supported.">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="nav">
        <div class="nav__container">
            <a href="/" class="nav__logo">
                <img src="/images/logo.svg" alt="FinancePro" width="120" height="40">
            </a>
            <button class="nav__toggle" aria-label="Toggle navigation">
                <span class="nav__toggle-line"></span>
                <span class="nav__toggle-line"></span>
                <span class="nav__toggle-line"></span>
            </button>
            <ul class="nav__menu">
                <li><a href="/" class="nav__link">Home</a></li>
                <li><a href="/services.html" class="nav__link">Services</a></li>
                <li><a href="/resources.html" class="nav__link">Resources</a></li>
                <li><a href="/contact.html" class="nav__link">Contact</a></li>
                <li><a href="/booking.html" class="nav__link nav__link--cta">Book Consultation</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="padding-top: 6rem; padding-bottom: 6rem;">
        <div class="services-preview__header">
            <h1 class="services-preview__title">Secure Payment</h1>
            <p class="services-preview__subtitle">
                Complete your payment securely using your preferred method
            </p>
        </div>

        <div style="max-width: 600px; margin: 0 auto;">
            <form data-payment-form class="payment-form">
                <div class="form-group">
                    <label class="form-label" for="service">Service</label>
                    <select class="form-select" id="service" name="service" required>
                        <option value="">Select a service</option>
                        <option value="financial-planning">Financial Planning Consultation - $500</option>
                        <option value="investment-guidance">Investment Guidance Session - $750</option>
                        <option value="tax-management">Tax Management Services - $600</option>
                        <option value="business-loans">Business Loan Advisory - $400</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="amount">Amount ($)</label>
                    <input type="number" class="form-input" id="amount" name="amount" min="50" max="5000" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" class="form-input" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-input" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Payment Method</label>
                    <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 0.5rem;">
                        <label class="form-checkbox">
                            <input type="radio" name="payment-method" value="stripe">
                            <span>💳 Credit/Debit Card (Stripe)</span>
                        </label>
                        <label class="form-checkbox">
                            <input type="radio" name="payment-method" value="razorpay">
                            <span>🏦 UPI/Cards (Razorpay)</span>
                        </label>
                        <label class="form-checkbox">
                            <input type="radio" name="payment-method" value="demo" checked>
                            <span>🎯 Demo Mode (No Real Payment)</span>
                        </label>
                    </div>
                </div>

                <div style="background: var(--color-gray-50); padding: 1rem; border-radius: var(--radius-lg); margin-bottom: 2rem;">
                    <h4 style="margin-bottom: 0.5rem;">Security Notice</h4>
                    <p style="font-size: 0.875rem; color: var(--color-gray-600); margin: 0;">
                        🔒 Your payment information is encrypted and secure. We never store your card details.
                    </p>
                </div>

                <button type="submit" class="btn btn--primary btn--large" style="width: 100%;">
                    Complete Payment
                </button>
            </form>
        </div>
    </main>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/payment.js"></script>
</body>
</html>
