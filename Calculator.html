<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #181818;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            border: 1px solid #444;
            padding: 20px;
            border-radius: 15px;
            background: #222;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .calculator form input {
            border: 0;
            outline: 0;
            width: 60px;
            height: 60px;
            border-radius: 10px;
            box-shadow: -5px -5px 12px rgba(255, 255, 255, 0.1),
                        5px 5px 12px rgba(0, 0, 0, 0.2);
            background: #333;
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
            margin: 10px;
            transition: 0.2s ease;
        }

        .calculator form input:hover {
            background: #444;
        }

        form .display {
            display: flex;
            justify-content: flex-end;
            margin: 20px 0;
        }
      #display {
       padding: 10px 12px; 
       }

        form .display input {
            text-align: right;
            flex: 1;
            font-size: 2rem;
            box-shadow: none;
            background: #000;
        }

        form input.equal {
            width: 140px;
            background: #0f0;
            color: #000;
        }

        .copy-info {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 10px;
            text-align: center;
        }
        .logo-container {
      display: flex;
      align-items: center;
      gap: 14px;
      position: fixed; 
      top: 0;
      left: 0;
      margin-top: 10px;
      margin-left: 10px;
      z-index: 1000;

    }

    .logo-circle {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at center, #00ffe1, #0051ff);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 25px rgba(0, 255, 255, 0.4);
      animation: rotateCircle 2s linear infinite;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }

    .logo-circle:hover {
      transform: scale(1.15) rotate(20deg);
      box-shadow: 0 0 30px #00ffe1, 0 0 50px #0088ff;
      border-color: #ffffff55;
    }

    @keyframes rotateCircle {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .logo-circle span {
      color: white;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 0 12px #00ffe1, 0 0 5px #0088ff;
      pointer-events: none;
    }

    .logo-text {
      color: #00ffe1;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .logo-text:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #00ffe1, 0 0 20px #0088ff;
    }
    </style>
</head>
<body>
    <div class="logo-container">
    <div class="logo-circle">
      <span>SW</span>
    </div>
    <div class="logo-text">StudyWeb</div>
  </div>
    <div class="calculator">
        <form>
            <div class="display">
                <input type="text" name="display" id="display">
            </div>
            <div>
                <input type="button" value="AC" onclick="clearDisplay()">
                <input type="button" value="DE" onclick="deleteLast()">
                <input type="button" value="." onclick="appendToDisplay('.')">
                <input type="button" value="/" onclick="appendToDisplay('/')">
            </div>
            <div>
                <input type="button" value="7" onclick="appendToDisplay('7')">
                <input type="button" value="8" onclick="appendToDisplay('8')">
                <input type="button" value="9" onclick="appendToDisplay('9')">
                <input type="button" value="*" onclick="appendToDisplay('*')">
            </div>
            <div>
                <input type="button" value="4" onclick="appendToDisplay('4')">
                <input type="button" value="5" onclick="appendToDisplay('5')">
                <input type="button" value="6" onclick="appendToDisplay('6')">
                <input type="button" value="-" onclick="appendToDisplay('-')">
            </div>
            <div>
                <input type="button" value="1" onclick="appendToDisplay('1')">
                <input type="button" value="2" onclick="appendToDisplay('2')">
                <input type="button" value="3" onclick="appendToDisplay('3')">
                <input type="button" value="+" onclick="appendToDisplay('+')">
            </div>
            <div>
                <input type="button" value="00" onclick="appendToDisplay('00')">
                <input type="button" value="0" onclick="appendToDisplay('0')">
                <input type="button" value="=" class="equal" onclick="calculate()">
            </div>
        </form>
        <div class="copy-info" id="copy-info"></div>
    </div>

    <script>
        const display = document.getElementById('display');
        const copyInfo = document.getElementById('copy-info');

        function appendToDisplay(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = '';
            copyInfo.textContent = '';
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                let result = eval(display.value);
                display.value = result;
                showCopyMessage(result);
            } catch {
                display.value = 'Error';
            }
        }

        function showCopyMessage(result) {
            copyInfo.textContent = 'Result: ' + result + ' (Click to Copy)';
            copyInfo.style.cursor = 'pointer';
            copyInfo.onclick = () => {
                try {
                    navigator.clipboard.writeText(result);
                    copyInfo.textContent = 'Copied to clipboard!';
                } catch (e) {
                    alert('Clipboard permission denied in this browser. Copy manually.');
                }
            };
        }
    </script>
</body>
</html>
