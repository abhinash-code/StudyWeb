<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Page</title>
    <style>
        body{
            background: #020024;
background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%,
 rgba(9, 9, 121, 1) 51%, rgba(0, 212, 255, 1) 100%);
        }
        h1 {
            color: whitesmoke;
            font-size: 50px;
            font-family: monospace;
            font-weight: 800;
            text-shadow: 10px 10px 10px rgb(49, 45, 45);
            margin-left: 27%;
        
        }
      button {
  border: none;
  padding: 0.8em 2.5em;
  outline: none;
  color: white;
  font-style: 1.2em;
  position: relative;
  z-index: 1;
  cursor: pointer;
  background: none;
  text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.45);
}

button:before,
button:after {
  position: absolute;
  top: 50%;
  left: 50%;
  border-radius: 10em;
  -webkit-transform: translateX(-50%) translateY(-50%);
  transform: translateX(-50%) translateY(-50%);
  width: 105%;
  height: 105%;
  content: "";
  z-index: -2;
  background-size: 400% 400%;
  background: linear-gradient(
    60deg,
    #f79533,
    #f37055,
    #ef4e7b,
    #a166ab,
    #5073b8,
    #1098ad,
    #07b39b,
    #6fba82
  );
}

button:before {
  -webkit-filter: blur(7px);
  filter: blur(7px);
  -webkit-transition: all 0.25s ease;
  transition: all 0.25s ease;
  -webkit-animation: pulse 10s infinite ease;
  animation: pulse 10s infinite ease;
}

button:after {
  -webkit-filter: blur(0.3px);
  filter: blur(0.3px);
}

button:hover:before {
  width: 115%;
  height: 115%;
}
button:hover {
    transform: scale(0.75s);
}
button {
  display: block;
  margin: 30px 40%;
}

    </style>
</head>
<body>
    <h1>Welcome To StudyWeb</h1>
    <button onclick="nextPage()">Visit↪</button>
    <script>
        function nextPage() {
            let pass = prompt("Fill password of this page:");
            if (pass === "study098") {
                document.location.href = "HomePage.html";
            } else {
                alert("Your password is incorrect .....!!")
            }
        }
    </script>
</body>
</html>
