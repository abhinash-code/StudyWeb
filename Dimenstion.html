<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensional Formulas Explorer | 12th Physics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(255, 255, 255, 0.06);
            --bg-card-hover: rgba(255, 255, 255, 0.1);
            --bg-accent: #06b6d4;
            --bg-accent-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #6d28d9 100%);
            --text-primary: #e6eef8;
            --text-secondary: #9fb3d6;
            --text-accent: #06b6d4;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.2);
            --glow: 0 0 15px rgba(6, 182, 212, 0.5);
            --transition: all 0.3s ease;
            --border-radius: 12px;
            --card-border-radius: 16px;
            --backdrop-blur: blur(10px);
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-secondary: #e2e8f0;
            --bg-card: rgba(255, 255, 255, 0.8);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        body {
            background: var(--bg-accent-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: var(--backdrop-blur);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            animation: pulse 2s infinite ease-in-out;
        }
        
        .logo i {
            font-size: 2rem;
            color: var(--text-accent);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #e6eef8, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        h2 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--text-secondary);
        }
        
        .controls {
            background: var(--bg-card);
            backdrop-filter: var(--backdrop-blur);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }
        
        .search-container {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--bg-accent);
            box-shadow: var(--glow);
        }
        
        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        
        .filter-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .category-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            flex: 1;
        }
        
        .chip {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .chip.active {
            background: var(--bg-accent);
            color: var(--bg-primary);
            box-shadow: var(--glow);
        }
        
        .chip:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .sort-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        select {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .language-toggle {
            display: flex;
            justify-content: center;
            margin: 1rem 0;
        }
        
        .toggle-container {
            display: flex;
            background: var(--bg-secondary);
            border-radius: 50px;
            padding: 0.25rem;
            border: 1px solid var(--border-color);
        }
        
        .toggle-option {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
        }
        
        .toggle-option.active {
            background: var(--bg-accent);
            color: var(--bg-primary);
        }
        
        .formulas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }
        
        .formula-card {
            background: var(--bg-card);
            backdrop-filter: var(--backdrop-blur);
            border-radius: var(--card-border-radius);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(20px) rotate(2deg);
            animation: cardEntrance 0.6s ease forwards;
        }
        
        .formula-card:hover {
            transform: translateY(-8px) scale(1.02) rotate(0);
            box-shadow: var(--shadow-lg);
            background: var(--bg-card-hover);
            border-color: rgba(6, 182, 212, 0.3);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        
        .category-tag {
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            background: var(--bg-accent);
            color: var(--bg-primary);
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .copy-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            transition: var(--transition);
        }
        
        .copy-btn:hover {
            color: var(--bg-accent);
            transform: scale(1.1);
        }
        
        .english-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        
        .hindi-name {
            min-height: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-style: italic;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        .hindi-name:empty:before {
            content: "Click to add Hindi name";
            color: var(--text-secondary);
            opacity: 0.7;
        }
        
        .formula {
            font-family: monospace;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        
        .dimensional-formula {
            font-family: monospace;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 1rem 0;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            text-align: center;
            letter-spacing: 1px;
            color: var(--text-accent);
        }
        
        .notes {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-color);
        }
        
        .floating-actions {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 100;
        }
        
        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-accent);
            color: var(--bg-primary);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .action-btn:after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }
        
        .action-btn:hover {
            transform: scale(1.1);
        }
        
        .action-btn:hover:after {
            animation: ripple 1s ease-out;
        }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 1rem 2rem;
            border-radius: 50px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 100;
        }
        
        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            backdrop-filter: var(--backdrop-blur);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .overlay-content {
            background: var(--bg-card);
            backdrop-filter: var(--backdrop-blur);
            border-radius: var(--card-border-radius);
            padding: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            max-width: 600px;
            width: 90%;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        
        .overlay.active .overlay-content {
            transform: scale(1);
        }
        
        .close-overlay {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(20px) rotate(2deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotate(0);
            }
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.7);
            }
            70% {
                transform: scale(1.02);
                box-shadow: 0 0 0 10px rgba(6, 182, 212, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(6, 182, 212, 0);
            }
        }
        
        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            20% {
                transform: scale(25, 25);
                opacity: 0.3;
            }
            100% {
                opacity: 0;
                transform: scale(40, 40);
            }
        }
        
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .formulas-grid {
                grid-template-columns: 1fr;
            }
            
            .filter-controls {
                flex-direction: column;
            }
            
            .floating-actions {
                bottom: 1rem;
                right: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-atom"></i>
            </div>
            <h1>Dimensional Formulas Explorer</h1>
            <h2>12th Grade Physics Reference</h2>
            <h2>All Physics Dimensional Formulas are Available in This Page</h2>
        </header>

        <section class="controls">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" placeholder="Search formulas..." id="searchInput">
            </div>

            <div class="filter-controls">
                <div class="category-chips" id="categoryFilters">
                    <!-- Category chips will be generated here -->
                </div>
                
                <div class="sort-container">
                    <label for="sortSelect">Sort by:</label>
                    <select id="sortSelect">
                        <option value="name">Name</option>
                        <option value="category">Category</option>
                    </select>
                </div>
            </div>

            <div class="language-toggle">
                <div class="toggle-container">
                    <div class="toggle-option active" data-lang="english">English</div>
                    <div class="toggle-option" data-lang="both">Both</div>
                    <div class="toggle-option" data-lang="hindi">Hindi</div>
                </div>
            </div>
        </section>

        <main>
            <div class="formulas-grid" id="formulasContainer">
                <!-- Formula cards will be generated here -->
            </div>
        </main>
    </div>

    <div class="floating-actions">
        <button class="action-btn" id="addFormulaBtn" title="Add new formula">
            <i class="fas fa-plus"></i>
        </button>
        <button class="action-btn" id="exportJsonBtn" title="Export to JSON">
            <i class="fas fa-download"></i>
        </button>
        <button class="action-btn" id="importJsonBtn" title="Import from JSON">
            <i class="fas fa-upload"></i>
        </button>
    </div>

    <div class="theme-toggle">
        <button class="theme-btn" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Copied to clipboard!</span>
    </div>

    <div class="overlay" id="formulaOverlay">
        <div class="overlay-content">
            <button class="close-overlay" id="closeOverlay">
                <i class="fas fa-times"></i>
            </button>
            <div id="overlayContent">
                <!-- Focus mode content will be generated here -->
            </div>
        </div>
    </div>

    <input type="file" id="importFile" accept=".json" style="display: none;">

    hindiName: "kB",
    category: "Physical Constants",
    formula: "kB",
    dimensionalFormula: "M L² T⁻² Θ⁻¹",
    notes: "Statistical mechanics constant"
}

        ];

        // App state
        let state = {
            activeCategories: [],
            searchQuery: "",
            sortBy: "name",
            languageMode: "english",
            currentTheme: "dark"
        };

        // DOM elements
        const formulasContainer = document.getElementById('formulasContainer');
        const categoryFilters = document.getElementById('categoryFilters');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const langOptions = document.querySelectorAll('.toggle-option');
        const themeToggle = document.getElementById('themeToggle');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const formulaOverlay = document.getElementById('formulaOverlay');
        const overlayContent = document.getElementById('overlayContent');
        const closeOverlay = document.getElementById('closeOverlay');
        const addFormulaBtn = document.getElementById('addFormulaBtn');
        const exportJsonBtn = document.getElementById('exportJsonBtn');
        const importJsonBtn = document.getElementById('importJsonBtn');
        const importFile = document.getElementById('importFile');

        // Initialize the app
        function init() {
            loadFromLocalStorage();
            renderCategoryFilters();
            renderFormulas();
            setupEventListeners();
        }

        // Load data from localStorage
        function loadFromLocalStorage() {
            // Load saved Hindi names
            formulas.forEach(formula => {
                const savedName = localStorage.getItem(`hindiName_${formula.id}`);
                if (savedName) {
                    formula.hindiName = savedName;
                }
            });

            // Load theme preference
            const savedTheme = localStorage.getItem('dimformulas_theme');
            if (savedTheme) {
                state.currentTheme = savedTheme;
                document.documentElement.setAttribute('data-theme', savedTheme);
                updateThemeIcon();
            }
            
            // Load language preference
            const savedLang = localStorage.getItem('dimformulas_lang');
            if (savedLang) {
                state.languageMode = savedLang;
                document.querySelectorAll('.toggle-option').forEach(opt => {
                    opt.classList.toggle('active', opt.dataset.lang === savedLang);
                });
            }
        }

        // Render category filter chips
        function renderCategoryFilters() {
            // Get all unique categories
            const categories = [...new Set(formulas.map(f => f.category))];
            
            // Add "Show All" chip
            const allChip = document.createElement('div');
            allChip.className = 'chip active';
            allChip.textContent = 'Show All';
            allChip.dataset.category = 'all';
            allChip.addEventListener('click', () => toggleCategoryFilter('all'));
            categoryFilters.appendChild(allChip);
            
            // Add category chips
            categories.forEach(category => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.textContent = category;
                chip.dataset.category = category;
                chip.addEventListener('click', () => toggleCategoryFilter(category));
                categoryFilters.appendChild(chip);
            });
        }

        // Toggle category filter
        function toggleCategoryFilter(category) {
            if (category === 'all') {
                // Reset all filters
                state.activeCategories = [];
                document.querySelectorAll('.chip').forEach(chip => {
                    chip.classList.remove('active');
                });
                document.querySelector('[data-category="all"]').classList.add('active');
            } else {
                // Toggle the specific category
                const index = state.activeCategories.indexOf(category);
                if (index === -1) {
                    state.activeCategories.push(category);
                } else {
                    state.activeCategories.splice(index, 1);
                }
                
                // Update chip active state
                document.querySelector(`[data-category="${category}"]`).classList.toggle('active');
                
                // Update "Show All" chip
                const allChip = document.querySelector('[data-category="all"]');
                if (state.activeCategories.length === 0) {
                    allChip.classList.add('active');
                } else {
                    allChip.classList.remove('active');
                }
            }
            
            renderFormulas();
        }

        // Render formulas based on current filters
        function renderFormulas() {
            // Clear container
            formulasContainer.innerHTML = '';
            
            // Filter and sort formulas
            let filteredFormulas = filterFormulas();
            filteredFormulas = sortFormulas(filteredFormulas);
            
            // Add cards to container with staggered animation
            filteredFormulas.forEach((formula, index) => {
                const card = createFormulaCard(formula, index);
                formulasContainer.appendChild(card);
            });
            
            // If no formulas match the filter, show message
            if (filteredFormulas.length === 0) {
                const message = document.createElement('div');
                message.className = 'no-results';
                message.textContent = 'No formulas match your search criteria.';
                message.style.gridColumn = '1 / -1';
                message.style.textAlign = 'center';
                message.style.padding = '2rem';
                message.style.color = 'var(--text-secondary)';
                formulasContainer.appendChild(message);
            }
        }

        // Filter formulas based on active filters and search query
        function filterFormulas() {
            return formulas.filter(formula => {
                // Category filter
                if (state.activeCategories.length > 0 && !state.activeCategories.includes(formula.category)) {
                    return false;
                }
                
                // Search query
                if (state.searchQuery) {
                    const query = state.searchQuery.toLowerCase();
                    return (
                        formula.englishName.toLowerCase().includes(query) ||
                        formula.hindiName.toLowerCase().includes(query) ||
                        formula.formula.toLowerCase().includes(query) ||
                        formula.dimensionalFormula.toLowerCase().includes(query) ||
                        formula.category.toLowerCase().includes(query)
                    );
                }
                
                return true;
            });
        }

        // Sort formulas based on current sort option
        function sortFormulas(formulasToSort) {
            return [...formulasToSort].sort((a, b) => {
                if (state.sortBy === 'name') {
                    return a.englishName.localeCompare(b.englishName);
                } else if (state.sortBy === 'category') {
                    return a.category.localeCompare(b.category) || a.englishName.localeCompare(b.englishName);
                }
                return 0;
            });
        }

        // Create a formula card element
        function createFormulaCard(formula, index) {
            const card = document.createElement('div');
            card.className = 'formula-card';
            card.style.animationDelay = `${index * 0.1}s`;
            card.dataset.id = formula.id;
            
            // Card header with category and copy button
            const cardHeader = document.createElement('div');
            cardHeader.className = 'card-header';
            
            const categoryTag = document.createElement('div');
            categoryTag.className = 'category-tag';
            categoryTag.textContent = formula.category;
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '<i class="far fa-copy"></i>';
            copyBtn.title = 'Copy dimensional formula';
            copyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                copyToClipboard(formula.dimensionalFormula);
                showToast('Dimensional formula copied!');
            });
            
            cardHeader.appendChild(categoryTag);
            cardHeader.appendChild(copyBtn);
            
            // English name
            const englishName = document.createElement('div');
            englishName.className = 'english-name';
            englishName.textContent = formula.englishName;
            
            // Hindi name (contentEditable)
            const hindiName = document.createElement('div');
            hindiName.className = 'hindi-name';
            hindiName.contentEditable = true;
            hindiName.textContent = formula.hindiName;
            hindiName.addEventListener('blur', () => {
                formula.hindiName = hindiName.textContent;
                localStorage.setItem(`hindiName_${formula.id}`, formula.hindiName);
            });
            
            // Formula
            const formulaEl = document.createElement('div');
            formulaEl.className = 'formula';
            formulaEl.textContent = formula.formula;
            
            // Dimensional formula
            const dimensionalFormula = document.createElement('div');
            dimensionalFormula.className = 'dimensional-formula';
            dimensionalFormula.textContent = `[${formula.dimensionalFormula}]`;
            
            // Notes
            const notes = document.createElement('div');
            notes.className = 'notes';
            notes.textContent = formula.notes || '';
            
            // Assemble card
            card.appendChild(cardHeader);
            
            // Show English name based on language mode
            if (state.languageMode !== 'hindi') {
                card.appendChild(englishName);
            }
            
            // Show Hindi name based on language mode
            if (state.languageMode !== 'english') {
                card.appendChild(hindiName);
            }
            
            // Show English formula based on language mode
            if (state.languageMode !== 'hindi') {
                card.appendChild(formulaEl);
            }
            
            card.appendChild(dimensionalFormula);
            card.appendChild(notes);
            
            // Add click event for focus mode
            card.addEventListener('click', () => showFormulaFocusMode(formula));
            
            return card;
        }

        // Show formula in focus mode
        function showFormulaFocusMode(formula) {
            overlayContent.innerHTML = `
                <h2>${formula.englishName}</h2>
                ${formula.hindiName ? `<div class="hindi-name">${formula.hindiName}</div>` : ''}
                <div class="category-tag" style="margin: 1rem 0">${formula.category}</div>
                <div class="formula">${formula.formula}</div>
                <div class="dimensional-formula" style="font-size: 2rem; margin: 2rem 0">[${formula.dimensionalFormula}]</div>
                ${formula.notes ? `<div class="notes">${formula.notes}</div>` : ''}
                <button class="copy-btn" style="margin-top: 1rem; align-self: center">
                    <i class="far fa-copy"></i> Copy Formula
                </button>
            `;
            
            // Add copy event to the button
            const copyBtn = overlayContent.querySelector('.copy-btn');
            copyBtn.addEventListener('click', () => {
                copyToClipboard(formula.dimensionalFormula);
                showToast('Dimensional formula copied!');
            });
            
            formulaOverlay.classList.add('active');
        }

        // Copy text to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // Show toast notification
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Toggle theme
        function toggleTheme() {
            state.currentTheme = state.currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', state.currentTheme);
            localStorage.setItem('dimformulas_theme', state.currentTheme);
            updateThemeIcon();
        }

        // Update theme icon based on current theme
        function updateThemeIcon() {
            const icon = themeToggle.querySelector('i');
            if (state.currentTheme === 'dark') {
                icon.className = 'fas fa-moon';
            } else {
                icon.className = 'fas fa-sun';
            }
        }

        // Export formulas to JSON file
        function exportToJson() {
            const dataStr = JSON.stringify(formulas, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = 'dimensional-formulas.json';
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        // Import formulas from JSON file
        function importFromJson() {
            importFile.click();
        }

        // Handle imported JSON file
        function handleImportedFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedFormulas = JSON.parse(e.target.result);
                    
                    // Validate the imported data
                    if (Array.isArray(importedFormulas) && importedFormulas.every(f => 
                        f.id && f.englishName && f.category && f.formula && f.dimensionalFormula
                    )) {
                        // Clear current formulas and add imported ones
                        formulas.length = 0;
                        importedFormulas.forEach(f => formulas.push(f));
                        
                        // Re-render everything
                        renderFormulas();
                        showToast('Formulas imported successfully!');
                    } else {
                        throw new Error('Invalid format');
                    }
                } catch (err) {
                    showToast('Error importing formulas. Invalid file format.');
                    console.error('Import error:', err);
                }
            };
            reader.readAsText(file);
            
            // Reset the input
            event.target.value = '';
        }

        // Set up event listeners
        function setupEventListeners() {
            // Search input
            searchInput.addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                renderFormulas();
            });
            
            // Sort select
            sortSelect.addEventListener('change', (e) => {
                state.sortBy = e.target.value;
                renderFormulas();
            });
            
            // Language options
            langOptions.forEach(option => {
                option.addEventListener('click', () => {
                    langOptions.forEach(opt => opt.classList.remove('active'));
                    option.classList.add('active');
                    state.languageMode = option.dataset.lang;
                    localStorage.setItem('dimformulas_lang', state.languageMode);
                    renderFormulas();
                });
            });
            
            // Theme toggle
            themeToggle.addEventListener('click', toggleTheme);
            
            // Close overlay
            closeOverlay.addEventListener('click', () => {
                formulaOverlay.classList.remove('active');
            });
            
            // Floating action buttons
            addFormulaBtn.addEventListener('click', () => {
                showToast('Add new formula feature coming soon!');
            });
            
            exportJsonBtn.addEventListener('click', exportToJson);
            importJsonBtn.addEventListener('click', importFromJson);
            importFile.addEventListener('change', handleImportedFile);
            
            // Close overlay when clicking outside
            formulaOverlay.addEventListener('click', (e) => {
                if (e.target === formulaOverlay) {
                    formulaOverlay.classList.remove('active');
                }
            });
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
