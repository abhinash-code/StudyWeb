<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 12 English Notes</title>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --prose-color: #e8f6ef;
            --poetry-color: #fef7e0;
            --primary-color: #3a6ea5;
            --secondary-color: #5a8cc7;
            --text-color: #222;
            --light-gray: #f5f5f5;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: #f9f9f9;
            padding-bottom: 60px;
        }

        /* Header Styles */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.2rem;
            text-align: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 0.6rem 1.2rem;
            background-color: white;
            border: none;
            border-radius: 4px;
            color: var(--primary-color);
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--secondary-color);
            color: white;
        }

        /* Search Bar */
        .search-container {
            margin: 1rem auto;
            max-width: 500px;
            padding: 0 1rem;
        }

        .search-bar {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        /* Main Content */
        main {
            padding: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Cards Layout */
        .cards-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        @media (min-width: 600px) {
            .cards-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 900px) {
            .cards-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Card Styles */
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: fadeIn 0.5s ease-out;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .card.prose {
            border-top: 4px solid var(--prose-color);
        }

        .card.poetry {
            border-top: 4px solid var(--poetry-color);
        }

        .card-content {
            padding: 1.2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0.8rem;
        }

        .author-image {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 0.8rem;
            background-color: #eee;
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 0.4rem;
            color: var(--primary-color);
        }

        .card-author {
            font-weight: 500;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .card-type {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .type-prose {
            background-color: var(--prose-color);
            color: #2c5aa0;
        }

        .type-poetry {
            background-color: var(--poetry-color);
            color: #b06c16;
        }

        .card-summary {
            margin: 0.8rem 0;
            color: #555;
            flex-grow: 1;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .details-btn {
            padding: 0.5rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
        }

        .details-btn:hover {
            background-color: var(--secondary-color);
        }

        .favorite-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #ccc;
            transition: var(--transition);
        }

        .favorite-btn.active {
            color: #e74c3c;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            overflow-y: auto;
            padding: 1rem;
        }

        .modal-content {
            background-color: white;
            margin: 2rem auto;
            border-radius: 8px;
            max-width: 600px;
            animation: modalFadeIn 0.3s;
            position: relative;
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-author-info {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-author-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 1rem;
            background-color: #eee;
        }

        .modal-author-details {
            flex-grow: 1;
        }

        .modal-author-name {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }

        .modal-work-type {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .modal-summary {
            margin: 1.5rem 0;
            padding: 1rem;
            background-color: var(--light-gray);
            border-radius: 4px;
            min-height: 100px;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }

        .modal-btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
        }

        .print-btn {
            background-color: var(--primary-color);
            color: white;
        }

        .print-btn:hover {
            background-color: var(--secondary-color);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
            color: #666;
            font-size: 0.9rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Utilities */
        .hidden {
            display: none;
        }

        .instructions {
            background-color: #f8f9fa;
            border-left: 4px solid var(--primary-color);
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 0 4px 4px 0;
        }

        .instructions h3 {
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .instructions ul {
            padding-left: 1.5rem;
        }

        .instructions li {
            margin-bottom: 0.5rem;
        }

        /* Print Styles */
        @media print {
            header, nav, .search-container, .card-actions, footer, .modal-actions {
                display: none !important;
            }
            
            body, .card {
                background: white !important;
                color: black !important;
            }
            
            .cards-container {
                display: block !important;
            }
            
            .card {
                break-inside: avoid;
                margin-bottom: 1rem;
                box-shadow: none !important;
                border: 1px solid #ddd !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Class 12 English</h1>
        <nav>
            <button class="nav-btn active" data-filter="all">All</button>
            <button class="nav-btn" data-filter="prose">Prose</button>
            <button class="nav-btn" data-filter="poetry">Poetry</button>
        </nav>
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search by work or author...">
        </div>
    </header>

    <main>
        <div class="container">
            <div class="cards-container" id="cardsContainer">
                <!-- Cards will be generated by JavaScript -->
            </div>
            
            
        </div>
    </main>

    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-author-info">
                    <img src="" alt="" class="modal-author-image" id="modalAuthorImage">
                    <div class="modal-author-details">
                        <h3 class="modal-author-name" id="modalAuthorName"></h3>
                        <span class="modal-work-type" id="modalWorkType"></span>
                    </div>
                </div>
                <div class="modal-summary" id="modalSummary" contenteditable="true">
                    <!-- Summary content will be added here -->
                </div>
                <div class="modal-actions">
                    <button class="modal-btn print-btn" id="printBtn">Print</button>
                    <button class="favorite-btn modal-favorite" id="modalFavorite">♥</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Made for revision — StudyWeb | Abhinash (English)</p>
    </footer>

    <script>
        // Data array with all the notes
        const notesData = [
            // Prose section
            { "section": "Prose", "title": "Indian civilization and culture", "author": "Mahatma Gandhi", "authorImage": "images/mahatma_gandhi.jpg", "summary": "Gandhi's reflections on Indian civilization and its cultural values." },
            { "section": "Prose", "title": "Bharat is my home", "author": "Dr Zakir Hussain", "authorImage": "images/zakir_hussain.jpg", "summary": "A patriotic essay expressing deep connection with India as homeland." },
            { "section": "Prose", "title": "A pinch of snuff", "author": "Manohar Malgaonkar", "authorImage": "images/manohar_malgaonkar.jpg", "summary": "A humorous take on social customs and habits in Indian society." },
            { "section": "Prose", "title": "I have a dream", "author": "Martin Luther King", "authorImage": "images/martin_luther_king.jpg", "summary": "The iconic speech about racial equality and civil rights." },
            { "section": "Prose", "title": "Ideas that have helped mankind", "author": "Bertrand Russell", "authorImage": "images/bertrand_russell.jpg", "summary": "Russell's exploration of philosophical concepts that advanced humanity." },
            { "section": "Prose", "title": "The Artist", "author": "Shiga Naoya", "authorImage": "images/shiga_naoya.jpg", "summary": "A Japanese short story exploring the nature of art and creativity." },
            { "section": "Prose", "title": "A child is born", "author": "Germaine Greer", "authorImage": "images/germaine_greer.jpg", "summary": "Feminist perspective on childbirth and motherhood." },
            { "section": "Prose", "title": "How Free is the press", "author": "Dorothy L. Sayers", "authorImage": "images/dorothy_sayers.jpg", "summary": "Critical examination of media freedom and responsibilities." },
            { "section": "Prose", "title": "The Earth", "author": "H.E. Bates", "authorImage": "images/he_bates.jpg", "summary": "Nature writing exploring humanity's connection to the natural world." },
            { "section": "Prose", "title": "India through a traveller's Eye", "author": "Pearl S. Buck", "authorImage": "images/pearl_buck.jpg", "summary": "An American novelist's perspective on Indian culture and society." },
            { "section": "Prose", "title": "A Marriage Proposal", "author": "Anton Chekhov", "authorImage": "images/anton_chekhov.jpg", "summary": "A classic one-act comedy about relationships and social conventions." },

            // Poetry section
            { "section": "Poetry", "title": "Sweetest Love, I Do Not Go", "author": "John Donne", "authorImage": "images/john_donne.jpg", "summary": "Metaphysical poem about love and separation." },
            { "section": "Poetry", "title": "Songs Of Myself", "author": "Walt Whitman", "authorImage": "images/walt_whitman.jpg", "summary": "Celebration of the self and democratic ideals in free verse." },
            { "section": "Poetry", "title": "Now The Leaves Are Falling Fast", "author": "W. H. Auden", "authorImage": "images/wh_auden.jpg", "summary": "Modernist poem reflecting on change and mortality." },
            { "section": "Poetry", "title": "To Autumn", "author": "John Keats", "authorImage": "images/john_keats.jpg", "summary": "Ode celebrating the season of autumn and its sensory richness." },
            { "section": "Poetry", "title": "An Epitaph", "author": "Walter de la Mare", "authorImage": "images/walter_delamare.jpg", "summary": "A reflective poem on memory and loss." },
            { "section": "Poetry", "title": "The Soldier", "author": "Rupert Brooke", "authorImage": "images/rupert_brooke.jpg", "summary": "Patriotic sonnet about sacrifice for one's country." },
            { "section": "Poetry", "title": "Macavity: The Mystery Cat", "author": "T. S. Eliot", "authorImage": "images/ts_eliot.jpg", "summary": "Humorous poem about a cunning feline character." },
            { "section": "Poetry", "title": "Fire-Hymn", "author": "Keki N. Daruwala", "authorImage": "images/keki_daruwala.jpg", "summary": "Indian English poem exploring spiritual themes through fire imagery." },
            { "section": "Poetry", "title": "Snake", "author": "D. H. Lawrence", "authorImage": "images/dh_lawrence.jpg", "summary": "Symbolic poem about human encounter with a snake." },
            { "section": "Poetry", "title": "My Grandmother's House", "author": "Kamala Das", "authorImage": "images/kamala_das.jpg", "summary": "Nostalgic poem about childhood memories and lost love." }
        ];

        // DOM Elements
        const cardsContainer = document.getElementById('cardsContainer');
        const searchBar = document.querySelector('.search-bar');
        const navButtons = document.querySelectorAll('.nav-btn');
        const modal = document.getElementById('detailsModal');
        const closeModalBtn = document.querySelector('.close-modal');
        const printBtn = document.getElementById('printBtn');

        // State variables
        let currentFilter = 'all';
        let currentSearchTerm = '';
        let favorites = JSON.parse(localStorage.getItem('englishNotesFavorites')) || {};

        // Initialize the application
        function init() {
            renderCards();
            setupEventListeners();
        }

        // Set up event listeners
        function setupEventListeners() {
            // Navigation filter buttons
            navButtons.forEach(button => {
                button.addEventListener('click', () => {
                    navButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    currentFilter = button.dataset.filter;
                    renderCards();
                });
            });

            // Search functionality
            searchBar.addEventListener('input', (e) => {
                currentSearchTerm = e.target.value.toLowerCase();
                renderCards();
            });

            // Close modal
            closeModalBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });

            // Close modal when clicking outside
            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            // Print functionality
            printBtn.addEventListener('click', () => {
                window.print();
            });
        }

        // Filter and search cards
        function getFilteredData() {
            return notesData.filter(item => {
                const matchesFilter = currentFilter === 'all' || 
                                    (currentFilter === 'prose' && item.section === 'Prose') ||
                                    (currentFilter === 'poetry' && item.section === 'Poetry');
                
                const matchesSearch = currentSearchTerm === '' || 
                                    item.title.toLowerCase().includes(currentSearchTerm) ||
                                    item.author.toLowerCase().includes(currentSearchTerm);
                
                return matchesFilter && matchesSearch;
            });
        }

        // Render cards based on current filter and search
        function renderCards() {
            const filteredData = getFilteredData();
            
            cardsContainer.innerHTML = '';
            
            if (filteredData.length === 0) {
                cardsContainer.innerHTML = '<p class="no-results">No results found</p>';
                return;
            }
            
            filteredData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `card ${item.section === 'Prose' ? 'prose' : 'poetry'}`;
                card.dataset.index = index;
                
                const isFavorite = favorites[item.title] || false;
                
                card.innerHTML = `
                    <div class="card-content">
                        <div class="card-header">
                            <img src="${item.authorImage}" alt="${item.author}" class="author-image" loading="lazy" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIiBmaWxsPSIjZGRkIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSI0MCIgZm9udC1mYW1pbHk9Im1vbm9zcGFjZSI+4KSqPC90ZXh0Pjwvc3ZnPg=='">
                            <div>
                                <h3 class="card-title">${item.title}</h3>
                                <p class="card-author">${item.author}</p>
                            </div>
                        </div>
                        <span class="card-type ${item.section === 'Prose' ? 'type-prose' : 'type-poetry'}">${item.section}</span>
                        <p class="card-summary">${item.summary || 'Summary not available. Click Read to add your own summary.'}</p>
                        <div class="card-actions">
                            <button class="details-btn" data-index="${index}">Read</button>
                            <button class="favorite-btn ${isFavorite ? 'active' : ''}" data-title="${item.title}">♥</button>
                        </div>
                    </div>
                `;
                
                cardsContainer.appendChild(card);
                
                // Add event listener to details button
                const detailsBtn = card.querySelector('.details-btn');
                detailsBtn.addEventListener('click', () => {
                    const slug = generateAuthorSlug(item.author);
                    window.location.href = `author_detail_english.html?writer=${slug}`;
                });
                
                // Add event listener to favorite button
                const favoriteBtn = card.querySelector('.favorite-btn');
                favoriteBtn.addEventListener('click', () => {
                    toggleFavorite(item.title, favoriteBtn);
                });
            });
        }

        // Generate author slug for URL
        function generateAuthorSlug(authorName) {
            // Predefined slugs for specific authors
            const authorSlugs = {
                "Mahatma Gandhi": "mahatma_gandhi",
                "Dr Zakir Hussain": "zakir_hussain",
                "Manohar Malgaonkar": "manohar_malgaonkar",
                "Martin Luther King": "martin_luther_king",
                "Bertrand Russell": "bertrand_russell",
                "Shiga Naoya": "shiga_naoya",
                "Germaine Greer": "germaine_greer",
                "Dorothy L. Sayers": "dorothy_sayers",
                "H.E. Bates": "he_bates",
                "Pearl S. Buck": "pearl_buck",
                "Anton Chekhov": "anton_chekhov",
                "John Donne": "john_donne",
                "Walt Whitman": "walt_whitman",
                "W. H. Auden": "wh_auden",
                "John Keats": "john_keats",
                "Walter de la Mare": "walter_delamare",
                "Rupert Brooke": "rupert_brooke",
                "T. S. Eliot": "ts_eliot",
                "Keki N. Daruwala": "keki_daruwala",
                "D. H. Lawrence": "dh_lawrence",
                "Kamala Das": "kamala_das"
            };
            
            // If author is in predefined list, return that slug
            if (authorSlugs[authorName]) {
                return authorSlugs[authorName];
            }
            
            // Otherwise generate a generic slug
            return authorName
                .toLowerCase()
                .replace(/'/g, "")  // Remove single quotes
                .replace(/[^a-z0-9]+/g, "_")  // Replace special chars with underscore
                .replace(/^_+|_+$/g, "");     // Remove leading/trailing underscores
        }

        // Toggle favorite status
        function toggleFavorite(title, buttonElement) {
            favorites[title] = !favorites[title];
            localStorage.setItem('englishNotesFavorites', JSON.stringify(favorites));
            
            if (favorites[title]) {
                buttonElement.classList.add('active');
            } else {
                buttonElement.classList.remove('active');
            }
            
            // Update all favorite buttons for this title
            document.querySelectorAll(`.favorite-btn[data-title="${title}"]`).forEach(btn => {
                if (favorites[title]) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
