<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            /* Color Palette based on provided image */
            --bg-page: #f8fafc;
            --text-main: #1e293b;
            --text-light: #64748b;
            --white: #ffffff;
            
            /* Category Colors */
            --cat-hydrogen: #e3001b;
            --cat-alkali: #2b509f;
            --cat-alkaline: #f37021;
            --cat-transition: #008a97;
            --cat-other-metal: #49398b;
            --cat-metalloid: #008b6b;
            --cat-nonmetal: #72bf44;
            --cat-halogen: #fdbb11;
            --cat-noble: #b91c3f;
            --cat-lanthanide: #f8b182;
            --cat-actinide: #ed5527;
            --cat-unknown: #94a3b8;

            /* UI Elements */
            --border-radius: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-glow: 0 0 15px rgba(0,0,0,0.3);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- Header & Controls --- */
        header {
            background-color: var(--white);
            padding: 1rem 2rem;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-svg {
            width: 40px;
            height: 40px;
            color: var(--cat-transition);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-light);
        }

        #searchInput {
            padding: 0.5rem 1rem 0.5rem 2rem;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            font-size: 0.875rem;
            outline: none;
            width: 250px;
            transition: var(--transition);
        }

        #searchInput:focus {
            border-color: var(--cat-transition);
            box-shadow: 0 0 0 3px rgba(0, 138, 151, 0.1);
        }

        select, button {
            padding: 0.5rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            font-size: 0.875rem;
            background: var(--white);
            cursor: pointer;
            outline: none;
            transition: var(--transition);
        }

        select:focus, button:hover {
            border-color: var(--cat-transition);
        }

        button {
            background: #f1f5f9;
            font-weight: 500;
        }

        button:hover {
            background: #e2e8f0;
        }

        /* --- Legend --- */
        .legend-container {
            max-width: 1400px;
            margin: 1.5rem auto 0;
            padding: 0 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            transition: var(--transition);
            opacity: 0.8;
        }

        .legend-item:hover {
            opacity: 1;
            background: rgba(0,0,0,0.05);
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        /* --- Main Layout & Grid --- */
        main {
            padding: 2rem 1rem;
            max-width: 1600px;
            margin: 0 auto;
            overflow-x: auto; /* For mobile */
        }

        .periodic-table {
            display: grid;
            grid-template-columns: 20px repeat(18, minmax(60px, 1fr));
            grid-template-rows: 20px repeat(7, minmax(70px, 1fr)) 20px repeat(2, minmax(70px, 1fr));
            gap: 4px;
            min-width: 1200px; /* Force minimum width to prevent squishing */
        }

        /* Grid Labels */
        .grid-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .group-label {
            grid-row: 1;
        }

        .period-label {
            grid-column: 1;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

        /* --- Element Box --- */
        .element {
            position: relative;
            background-color: var(--white);
            border-radius: var(--border-radius);
            padding: 4px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            color: var(--white); /* Default text color for colored boxes */
            overflow: hidden;
        }

        .element::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.05) 100%);
            pointer-events: none;
        }

        .element.dimmed {
            opacity: 0.15;
            filter: grayscale(80%);
            pointer-events: none;
        }

        .element:hover {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: var(--shadow-glow);
        }

        .el-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .el-num {}
        .el-mass { text-align: right; }

        .el-symbol {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin: auto 0;
            line-height: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .el-name {
            font-size: 0.6rem;
            text-align: center;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.9;
        }

        /* Placeholder boxes */
        .placeholder {
            background-color: transparent !important;
            border: 2px dashed #cbd5e1;
            color: var(--text-light) !important;
            justify-content: center;
            align-items: center;
            box-shadow: none;
            cursor: default;
        }
        .placeholder:hover {
            transform: none;
            box-shadow: none;
        }
        .placeholder .el-symbol {
            font-size: 0.8rem;
            text-shadow: none;
        }

        /* --- Category Colors --- */
        .cat-hydrogen { background-color: var(--cat-hydrogen); }
        .cat-alkali { background-color: var(--cat-alkali); }
        .cat-alkaline { background-color: var(--cat-alkaline); }
        .cat-transition { background-color: var(--cat-transition); }
        .cat-other-metal { background-color: var(--cat-other-metal); }
        .cat-metalloid { background-color: var(--cat-metalloid); }
        .cat-nonmetal { background-color: var(--cat-nonmetal); }
        .cat-halogen { background-color: var(--cat-halogen); color: var(--text-main); } /* Yellow background needs dark text */
        .cat-noble { background-color: var(--cat-noble); }
        .cat-lanthanide { background-color: var(--cat-lanthanide); color: var(--text-main); }
        .cat-actinide { background-color: var(--cat-actinide); }
        .cat-unknown { background-color: var(--cat-unknown); }

        /* Fix text color for light backgrounds */
        .cat-halogen .el-symbol, .cat-lanthanide .el-symbol { text-shadow: none; }

        /* --- Modal Styles --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--white);
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            position: relative;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 2rem;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 2rem;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.4);
        }

        .modal-symbol-box {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .modal-title-area {
            flex: 1;
        }

        .modal-name {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 0.25rem;
        }

        .modal-category {
            font-size: 1rem;
            opacity: 0.9;
            text-transform: capitalize;
            font-weight: 500;
        }

        .modal-body {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        .data-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .data-label {
            font-size: 0.75rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .data-value {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 500;
        }

        /* Decorative background graphics */
        .bg-decor {
            position: absolute;
            opacity: 0.03;
            pointer-events: none;
            z-index: -1;
        }
        .bg-dna { top: 20px; right: 20px; width: 300px; }
        .bg-flask { bottom: 20px; left: 20px; width: 200px; }

        @media (max-width: 768px) {
            header { padding: 1rem; }
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls { width: 100%; }
            #searchInput { width: 100%; flex: 1; }
            select { flex: 1; }
            
            .legend-container { justify-content: flex-start; }
            
            main { padding: 1rem 0; }
            .periodic-table { 
                padding: 0 1rem; 
            }
            
            .modal-header { padding: 1.5rem; gap: 1rem; flex-direction: column; text-align: center; }
            .modal-name { font-size: 2rem; }
            .modal-body { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Background Decoration SVG (Simplified representation) -->
    <svg class="bg-decor bg-dna" viewBox="0 0 200 50" fill="currentColor">
        <path d="M10,25 Q20,5 30,25 T50,25 T70,25 T90,25 T110,25 T130,25 T150,25 T170,25 T190,25" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M10,25 Q20,45 30,25 T50,25 T70,25 T90,25 T110,25 T130,25 T150,25 T170,25 T190,25" stroke="currentColor" stroke-width="2" fill="none"/>
    </svg>
    <svg class="bg-decor bg-flask" viewBox="0 0 100 100" fill="currentColor">
        <path d="M40,10 L60,10 L60,40 L90,90 A5,5 0 0,1 85,100 L15,100 A5,5 0 0,1 10,90 L40,40 Z" stroke="currentColor" stroke-width="4" fill="none"/>
    </svg>

    <header>
        <div class="header-top">
            <div class="logo-title">
                <!-- Custom Hexagon Atom Logo -->
                <svg class="logo-svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" stroke-dasharray="10 5" />
                    <circle cx="50" cy="50" r="15" fill="currentColor" opacity="0.2"/>
                    <circle cx="50" cy="50" r="5" fill="currentColor"/>
                    <ellipse cx="50" cy="50" rx="40" ry="12" transform="rotate(30 50 50)"/>
                    <ellipse cx="50" cy="50" rx="40" ry="12" transform="rotate(150 50 50)"/>
                </svg>
                <h1>Periodic Table of Elements</h1>
            </div>
            <div class="controls">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="Search by name, symbol, or number...">

                <select id="categoryFilter">

                    <option value="cat-alkali">Alkali Metals</option>

                    <option value="cat-other-metal">Other Metals</option>
                    <option value="cat-metalloid">Metalloids</option>
                    <option value="cat-nonmetal">Non-metals</option>
                    <option value="cat-halogen">Halogens</option>
                    <option value="cat-noble">Noble Gases</option>
                    <option value="cat-lanthanide">Lanthanides</option>
                    <option value="cat-actinide">Actinides</option>
                </select>
                <button id="resetBtn">Reset</button>
            </div>
        </div>
        
        <div class="legend-container" id="legend">
            <!-- Legend items injected via JS -->
        </div>
    </header>

    <main>
        <div class="periodic-table" id="table">
            <!-- Elements injected via JS -->
        </div>
    </main>

    <div class="modal-overlay" id="elementModal">
        <div class="modal-content">
            <div class="modal-header" id="modalHeader">
                <button class="close-btn" id="closeModal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <div class="modal-symbol-box" id="modalSymbol">H</div>
                <div class="modal-title-area">
                    <div class="modal-name" id="modalName">Hydrogen</div>
                    <div class="modal-category" id="modalCategory">Diatomic Nonmetal</div>
                </div>
            </div>
            <div class="modal-body">
                <div class="data-group">
                    <span class="data-label">Atomic Number</span>
                    <span class="data-value" id="modalNum">1</span>
                </div>
                <div class="data-group">
                    <span class="data-label">Atomic Mass</span>
                    <span class="data-value" id="modalMass">1.008 u</span>
                </div>
                <div class="data-group">
                    <span class="data-label">Group / Period</span>
                    <span class="data-value" id="modalGroupPeriod">1 / 1</span>
                </div>
                <div class="data-group">
                    <span class="data-label">Electron Configuration</span>
                    <span class="data-value" id="modalConfig">1s¹</span>
                </div>
                <div class="data-group">
                    <span class="data-label">Standard State</span>
                    <span class="data-value" id="modalState">Gas</span>
                </div>
                <div class="data-group">
                    <span class="data-label">Electronegativity</span>
                    <span class="data-value" id="modalElectro">2.20</span>
                </div>
                <div class="data-group">
                    <span class="data-label">Melting Point</span>
                    <span class="data-value" id="modalMelt">13.99 K</span>
                </div>

                    <span class="data-label">Boiling Point</span>
                    <span class="data-value" id="modalBoil">20.271 K</span>
                </div>
                <div class="data-group">
                    <span class="data-label">Discovery Year</span>
                    <span class="data-value" id="modalDiscover">1766</span>
                </div>
            </div>
        </div>
    </div>

        const CAT_MAP = {

            { num: 104, sym: 'Rf', name: 'Rutherfordium', mass: '(267)', group: 4, period: 7, cat: 'transition metal', elec: '[Rn] 5f¹⁴ 6d² 7s²', state: 'Solid', electro: 'Unknown', melt: '2400', boil: '5800', year: '1969' },
            { num: 105, sym: 'Db', name: 'Dubnium', mass: '(268)', group: 5, period: 7, cat: 'transition metal', elec: '[Rn] 5f¹⁴ 6d³ 7s²', state: 'Solid', electro: 'Unknown', melt: 'Unknown', boil: 'Unknown', year: '1970' },
            { num: 106, sym: 'Sg', name: 'Seaborgium', mass: '(269)', group: 6, period: 7, cat: 'transition metal', elec: '[Rn] 5f¹⁴ 6d⁴ 7s²', state: 'Solid', electro: 'Unknown', melt: 'Unknown', boil: 'Unknown', year: '1974' },
            { num: 107, sym: 'Bh', name: 'Bohrium', mass: '(270)', group: 7, period: 7, cat: 'transition metal', elec: '[Rn] 5f¹⁴ 6d⁵ 7s²', state: 'Solid', electro: 'Unknown', melt: 'Unknown', boil: 'Unknown', year: '1981' },
            { num: 108, sym: 'Hs', name: 'Hassium', mass: '(277)', group: 8, period: 7, cat: 'transition metal', elec: '[Rn] 5f¹⁴ 6d⁶ 7s²', state: 'Solid', electro: 'Unknown', melt: 'Unknown', boil: 'Unknown', year: '1984' },
            { num: 109, sym: 'Mt', name: 'Meitnerium', mass: '(278)', group: 9, period: 7, cat: 'unknown', elec: '[Rn] 5f¹⁴ 6d⁷ 7s²', state: 'Solid', electro: 'Unknown', melt: 'Unknown', boil: 'Unknown', year: '1982' },
            { num: 110, sym: 'Ds', name: 'Darmstadtium', mass: '(281)', group: 10, period: 7, cat: 'unknown', elec: '[Rn] 5f¹⁴ 6d⁸ 7s²', state: 'Solid', electro: 'Unknown', melt: 'Unknown', boil: 'Unknown', year: '1994' },
            { num: 111, sym: 'Rg', name: 'Roentgenium', mass: '(282)', group: 11, period: 7, cat: 'unknown', elec: '[Rn] 5f¹⁴ 6d⁹ 7s²', state: 'Solid', electro: 'Unknown', melt: 'Unknown', boil: 'Unknown', year: '1994' },
            { num: 112, sym: 'Cn', name: 'Copernicium', mass: '(285)', group: 12, period: 7, cat: 'transition metal', elec: '[Rn] 5f¹⁴ 6d¹⁰ 7s²', state: 'Gas', electro: 'Unknown', melt: 'Unknown', boil: '340', year: '1996' },
            { num: 113, sym: 'Nh', name: 'Nihonium', mass: '(286)', group: 13, period: 7, cat: 'unknown', elec: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p¹', state: 'Solid', electro: 'Unknown', melt: '700', boil: '1400', year: '2004' },
            { num: 114, sym: 'Fl', name: 'Flerovium', mass: '(289)', group: 14, period: 7, cat: 'post-transition metal', elec: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p²', state: 'Solid', electro: 'Unknown', melt: '340', boil: '420', year: '1998' },
            { num: 115, sym: 'Mc', name: 'Moscovium', mass: '(290)', group: 15, period: 7, cat: 'unknown', elec: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p³', state: 'Solid', electro: 'Unknown', melt: '670', boil: 'Unknown', year: '2003' },
            { num: 116, sym: 'Lv', name: 'Livermorium', mass: '(293)', group: 16, period: 7, cat: 'unknown', elec: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁴', state: 'Solid', electro: 'Unknown', melt: '709', boil: '1085', year: '2000' },
            { num: 117, sym: 'Ts', name: 'Tennessine', mass: '(294)', group: 17, period: 7, cat: 'unknown', elec: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁵', state: 'Solid', electro: 'Unknown', melt: '723', boil: '883', year: '2010' },
            { num: 118, sym: 'Og', name: 'Oganesson', mass: '(294)', group: 18, period: 7, cat: 'unknown', elec: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁶', state: 'Solid', electro: 'Unknown', melt: 'Unknown', boil: '350', year: '2002' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const tableContainer = document.getElementById('table');
            const legendContainer = document.getElementById('legend');
            const searchInput = document.getElementById('searchInput');
            const categoryFilter = document.getElementById('categoryFilter');
            const resetBtn = document.getElementById('resetBtn');
            const modal = document.getElementById('elementModal');
            const closeModalBtn = document.getElementById('closeModal');

            // 1. Build Legend
            categoriesList.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'legend-item';
                div.innerHTML = `<div class="legend-color" style="background-color: ${cat.color}"></div>${cat.label}`;
                div.addEventListener('click', () => {
                    categoryFilter.value = cat.id;
                    filterElements();
                });
                legendContainer.appendChild(div);
            });

            // 2. Build Grid Labels (Groups 1-18, Periods 1-7)
            for (let i = 1; i <= 18; i++) {
                const label = document.createElement('div');
                label.className = 'grid-label group-label';
                label.style.gridColumn = i + 1;
                label.textContent = i;
                tableContainer.appendChild(label);
            }
            for (let i = 1; i <= 7; i++) {
                const label = document.createElement('div');
                label.className = 'grid-label period-label';
                label.style.gridRow = i + 1;
                label.textContent = `PERIOD ${i}`;
                tableContainer.appendChild(label);
            }

            // Add Placeholders for Lanthanides and Actinides in main grid
            const laPlaceholder = document.createElement('div');
            laPlaceholder.className = 'element placeholder';
            laPlaceholder.style.gridColumn = '4'; // Group 3
            laPlaceholder.style.gridRow = '7';    // Period 6
            laPlaceholder.innerHTML = '<div class="el-symbol">57-71</div><div class="el-name">Lanthanides</div>';
            tableContainer.appendChild(laPlaceholder);

            const acPlaceholder = document.createElement('div');
            acPlaceholder.className = 'element placeholder';
            acPlaceholder.style.gridColumn = '4'; // Group 3
            acPlaceholder.style.gridRow = '8';    // Period 7
            acPlaceholder.innerHTML = '<div class="el-symbol">89-103</div><div class="el-name">Actinides</div>';
            tableContainer.appendChild(acPlaceholder);

            // 3. Render Elements
            elementsData.forEach(el => {
                const box = document.createElement('div');
                const cssClass = CAT_MAP[el.cat] || 'cat-unknown';
                box.className = `element ${cssClass}`;
                box.dataset.num = el.num;
                box.dataset.sym = el.sym.toLowerCase();
                box.dataset.name = el.name.toLowerCase();
                box.dataset.cat = cssClass;

                // Position Logic
                let col, row;
                if (el.num >= 57 && el.num <= 71) {
                    // Lanthanides row 9
                    col = (el.num - 57) + 4; // Start at col 4
                    row = 10; // 1 for group labels, 7 for periods, 1 for gap = 9 + 1
                } else if (el.num >= 89 && el.num <= 103) {
                    // Actinides row 10
                    col = (el.num - 89) + 4;
                    row = 11;
                } else {
                    col = el.group + 1; // +1 for period label column
                    row = el.period + 1; // +1 for group label row
                }

                box.style.gridColumn = col;
                box.style.gridRow = row;

                box.innerHTML = `
                    <div class="el-top">
                        <span class="el-num">${el.num}</span>
                        <span class="el-mass">${el.mass}</span>
                    </div>
                    <div class="el-symbol">${el.sym}</div>
                    <div class="el-name">${el.name}</div>
                `;

                box.addEventListener('click', () => openModal(el, cssClass));
                tableContainer.appendChild(box);
            });

            // 4. Search and Filter Logic
            function filterElements() {
                const term = searchInput.value.toLowerCase();
                const cat = categoryFilter.value;
                const elements = document.querySelectorAll('.element:not(.placeholder)');

                elements.forEach(el => {
                    const matchSearch = el.dataset.name.includes(term) || el.dataset.sym.includes(term) || el.dataset.num === term;
                    const matchCat = cat === 'all' || el.dataset.cat === cat;

                    if (matchSearch && matchCat) {
                        el.classList.remove('dimmed');
                    } else {
                        el.classList.add('dimmed');
                    }
                });
            }

            searchInput.addEventListener('input', filterElements);
            categoryFilter.addEventListener('change', filterElements);
            
            resetBtn.addEventListener('click', () => {
                searchInput.value = '';
                categoryFilter.value = 'all';
                filterElements();
            });

            // 5. Modal Logic
            function openModal(el, cssClass) {
                // Update Modal Colors based on category
                const header = document.getElementById('modalHeader');
                const bgColor = getComputedStyle(document.documentElement).getPropertyValue(`--${cssClass}`).trim();
                header.style.backgroundColor = bgColor;

                // Special case for light text on light backgrounds
                if (cssClass === 'cat-halogen' || cssClass === 'cat-lanthanide') {
                    header.style.color = 'var(--text-main)';
                    document.getElementById('closeModal').style.color = 'var(--text-main)';
                    document.getElementById('modalSymbol').style.textShadow = 'none';
                } else {
                    header.style.color = 'var(--white)';
                    document.getElementById('closeModal').style.color = 'white';
                    document.getElementById('modalSymbol').style.textShadow = '2px 2px 4px rgba(0,0,0,0.3)';
                }

                document.getElementById('modalSymbol').textContent = el.sym;
                document.getElementById('modalName').textContent = el.name;
                document.getElementById('modalCategory').textContent = el.cat;
                
                document.getElementById('modalNum').textContent = el.num;
                document.getElementById('modalMass').textContent = el.mass + ' u';
                document.getElementById('modalGroupPeriod').textContent = (el.group || 'N/A') + ' / ' + el.period;
                document.getElementById('modalConfig').textContent = el.elec;
                document.getElementById('modalState').textContent = el.state;
                document.getElementById('modalElectro').textContent = el.electro;
                document.getElementById('modalMelt').textContent = el.melt !== 'Unknown' ? el.melt + ' K' : 'Unknown';
                document.getElementById('modalBoil').textContent = el.boil !== 'Unknown' ? el.boil + ' K' : 'Unknown';
                document.getElementById('modalDiscover').textContent = el.year;

                modal.classList.add('active');
            }

            function closeModal() {
                modal.classList.remove('active');
            }

            closeModalBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        });
    </script>
