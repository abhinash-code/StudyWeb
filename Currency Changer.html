<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalXchange | Premium Currency Converter</title>
    <!-- 
      README:
      - Architecture: Vanilla JS, CSS Variables, Mobile-First.
      - Data Sources: primary: exchangerate.host, secondary: open.er-api.com.
      - Features: Virtualized List, Fuzzy Search, Offline Persistence, Theme Toggle.
      - Icons: Inline SVGs only.
      - Flags: CDN (flagcdn.com) with IntersectionObserver lazy loading.
    -->
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --border: #e2e8f0;
            --surface: #ffffff;
            --radius-2xl: 1.5rem;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #60a5fa;
            --accent-glow: rgba(96, 165, 250, 0.3);
            --border: #334155;
            --surface: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color var(--transition);
        }

        /* --- Layout --- */
        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--accent);
        }

        /* --- Converter Card --- */
        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
            padding: 2rem;
            box-shadow: var(--shadow);
            position: relative;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 2rem;
            align-items: center;
        }

        @media (max-width: 768px) {
            .main-card {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .swap-container {
                transform: rotate(90deg);
                justify-self: center;
            }
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .currency-selector {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .currency-selector:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .flag-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--border);
            flex-shrink: 0;
        }

        .flag-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .selector-text {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .currency-code {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .currency-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .amount-input-wrapper {
            position: relative;
        }

        .amount-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border);
            padding: 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            transition: border-color var(--transition);
        }

        .amount-input:focus {
            border-color: var(--accent);
        }

        .glow-effect {
            animation: glow 1s ease-out;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 0px var(--accent-glow); }
            50% { text-shadow: 0 0 15px var(--accent-glow); color: var(--accent); }
            100% { text-shadow: 0 0 0px var(--accent-glow); }
        }

        /* --- Swap Button --- */
        .swap-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: var(--transition);
        }

        .swap-btn:hover {
            transform: scale(1.1) rotate(180deg);
        }

        /* --- Currency List Overlay --- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            display: flex;
            opacity: 1;
            justify-content: center;
            align-items: flex-end;
        }

        @media (min-width: 768px) {
            .overlay.active {
                align-items: center;
            }
        }

        .drawer {
            background: var(--bg-color);
            width: 100%;
            max-width: 500px;
            height: 85vh;
            border-top-left-radius: var(--radius-2xl);
            border-top-right-radius: var(--radius-2xl);
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .drawer {
                height: 600px;
                border-radius: var(--radius-2xl);
            }
        }

        .overlay.active .drawer {
            transform: translateY(0);
        }

        .drawer-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0 0.75rem;
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0.75rem;
            outline: none;
            color: var(--text-main);
            font-size: 1rem;
        }

        .list-viewport {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid var(--border);
        }

        .list-item:hover, .list-item.selected {
            background: var(--surface);
        }

        .list-item .star-btn {
            margin-left: auto;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
        }

        .list-item .star-btn.active {
            color: #f59e0b;
        }

        /* --- Footer & Misc --- */
        footer {
            padding: 2rem 1rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.6rem;
            border-radius: 1rem;
            background: var(--border);
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .status-online { color: #10b981; }
        .status-offline { color: #ef4444; }

        .hidden { display: none; }

        /* Icon Styles */
        svg {
            fill: currentColor;
            flex-shrink: 0;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
        }

        .precision-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.2rem 0.4rem;
            border-radius: 0.4rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="brand">GlobalXchange</div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button id="themeToggle" class="swap-btn" style="background: var(--surface); color: var(--text-main); width: 40px; height: 40px;" title="Toggle Theme">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
                </button>
            </div>
        </header>

        <main class="main-card">
            <!-- FROM Panel -->
            <div class="panel" id="panelFrom">
                <div class="currency-selector" onclick="openSelector('from')">
                    <div class="flag-circle" id="flagFrom"></div>
                    <div class="selector-text">
                        <span class="currency-code" id="codeFrom">USD</span>
                        <span class="currency-name" id="nameFrom">United States Dollar</span>
                    </div>
                    <svg viewBox="0 0 24 24" width="20" height="20" style="color: var(--text-muted)"><path d="M7 10l5 5 5-5H7z"/></svg>
                </div>
                <div class="amount-input-wrapper">
                    <input type="number" id="inputFrom" class="amount-input" value="1.00" step="any" placeholder="0.00">
                </div>
            </div>

            <!-- SWAP -->
            <div class="swap-container">
                <button class="swap-btn" id="swapBtn" onclick="swapCurrencies()" title="Swap Currencies">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/></svg>
                </button>
            </div>

            <!-- TO Panel -->
            <div class="panel" id="panelTo">
                <div class="currency-selector" onclick="openSelector('to')">
                    <div class="flag-circle" id="flagTo"></div>
                    <div class="selector-text">
                        <span class="currency-code" id="codeTo">EUR</span>
                        <span class="currency-name" id="nameTo">Euro</span>
                    </div>
                    <svg viewBox="0 0 24 24" width="20" height="20" style="color: var(--text-muted)"><path d="M7 10l5 5 5-5H7z"/></svg>
                </div>
                <div class="amount-input-wrapper">
                    <input type="number" id="inputTo" class="amount-input" step="any" placeholder="0.00">
                </div>
            </div>
        </main>

        <div class="controls-row">
            <div class="precision-control">
                <span>Precision:</span>
                <select id="precisionSelect">
                    <option value="2">2 Decimals</option>
                    <option value="4" selected>4 Decimals</option>
                    <option value="6">6 Decimals</option>
                    <option value="8">8 Decimals</option>
                </select>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button onclick="copyResult()" class="swap-btn" style="background: var(--surface); color: var(--text-main); width: 36px; height: 36px;" title="Copy to clipboard">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </button>
                <button onclick="shareResult()" class="swap-btn" style="background: var(--surface); color: var(--text-main); width: 36px; height: 36px;" title="Share result">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                </button>
            </div>
        </div>

        <footer>
            <div style="margin-bottom: 0.5rem;">
                <span id="onlineBadge" class="status-badge status-online">
                    <span style="display:inline-block; width:6px; height:6px; background:currentColor; border-radius:50%"></span> Online
                </span>
                <span id="lastUpdated">Updating rates...</span>
            </div>
            <p>&copy; 2024 GlobalXchange • ISO 4217 Standard • <button onclick="fetchRates(true)" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size: inherit;">Refresh Rates</button></p>
        </footer>
    </div>

    <!-- Selection Overlay -->
    <div id="selectorOverlay" class="overlay" onclick="closeSelector(event)">
        <div class="drawer" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <div style="display:flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-weight: 700;">Select Currency</h3>
                    <button onclick="closeSelector(null)" style="background:none; border:none; cursor:pointer; color:var(--text-muted)">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
                <div class="search-container">
                    <svg viewBox="0 0 24 24" width="20" height="20" style="color:var(--text-muted)"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search country or currency..." autocomplete="off">
                </div>
            </div>
            <div id="listViewport" class="list-viewport">
                <!-- Items injected by JS -->
            </div>
        </div>
    </div>

    <script>
        /**
         * CURRENCY DATA & CONFIG
         * ISO 4217 Currency List (Snippet)
         */
        const ALL_CURRENCIES = [
            { code: 'USD', name: 'United States Dollar', country: 'United States', countryCode: 'us' },
            { code: 'EUR', name: 'Euro', country: 'European Union', countryCode: 'eu' },
            { code: 'GBP', name: 'British Pound Sterling', country: 'United Kingdom', countryCode: 'gb' },
            { code: 'JPY', name: 'Japanese Yen', country: 'Japan', countryCode: 'jp' },
            { code: 'INR', name: 'Indian Rupee', country: 'India', countryCode: 'in' },
            { code: 'AUD', name: 'Australian Dollar', country: 'Australia', countryCode: 'au' },
            { code: 'CAD', name: 'Canadian Dollar', country: 'Canada', countryCode: 'ca' },
            { code: 'CHF', name: 'Swiss Franc', country: 'Switzerland', countryCode: 'ch' },
            { code: 'CNY', name: 'Chinese Yuan', country: 'China', countryCode: 'cn' },
            { code: 'AED', name: 'UAE Dirham', country: 'United Arab Emirates', countryCode: 'ae' },
            { code: 'AFN', name: 'Afghan Afghani', country: 'Afghanistan', countryCode: 'af' },
            { code: 'ALL', name: 'Albanian Lek', country: 'Albania', countryCode: 'al' },
            { code: 'AMD', name: 'Armenian Dram', country: 'Armenia', countryCode: 'am' },
            { code: 'ANG', name: 'Netherlands Antillean Guilder', country: 'Netherlands Antilles', countryCode: 'an' },
            { code: 'AOA', name: 'Angolan Kwanza', country: 'Angola', countryCode: 'ao' },
            { code: 'ARS', name: 'Argentine Peso', country: 'Argentina', countryCode: 'ar' },
            { code: 'AWG', name: 'Aruban Florin', country: 'Aruba', countryCode: 'aw' },
            { code: 'AZN', name: 'Azerbaijani Manat', country: 'Azerbaijan', countryCode: 'az' },
            { code: 'BAM', name: 'Bosnia-Herzegovina Convertible Mark', country: 'Bosnia and Herzegovina', countryCode: 'ba' },
            { code: 'BBD', name: 'Barbadian Dollar', country: 'Barbados', countryCode: 'bb' },
            { code: 'BDT', name: 'Bangladeshi Taka', country: 'Bangladesh', countryCode: 'bd' },
            { code: 'BGN', name: 'Bulgarian Lev', country: 'Bulgaria', countryCode: 'bg' },
            { code: 'BHD', name: 'Bahraini Dinar', country: 'Bahrain', countryCode: 'bh' },
            { code: 'BIF', name: 'Burundian Franc', country: 'Burundi', countryCode: 'bi' },
            { code: 'BMD', name: 'Bermudan Dollar', country: 'Bermuda', countryCode: 'bm' },
            { code: 'BND', name: 'Brunei Dollar', country: 'Brunei', countryCode: 'bn' },
            { code: 'BOB', name: 'Bolivian Boliviano', country: 'Bolivia', countryCode: 'bo' },
            { code: 'BRL', name: 'Brazilian Real', country: 'Brazil', countryCode: 'br' },
            { code: 'BSD', name: 'Bahamian Dollar', country: 'Bahamas', countryCode: 'bs' },
            { code: 'BTN', name: 'Bhutanese Ngultrum', country: 'Bhutan', countryCode: 'bt' },
            { code: 'BWP', name: 'Botswanan Pula', country: 'Botswana', countryCode: 'bw' },
            { code: 'BYN', name: 'Belarusian Ruble', country: 'Belarus', countryCode: 'by' },
            { code: 'BZD', name: 'Belize Dollar', country: 'Belize', countryCode: 'bz' },
            { code: 'CLP', name: 'Chilean Peso', country: 'Chile', countryCode: 'cl' },
            { code: 'COP', name: 'Colombian Peso', country: 'Colombia', countryCode: 'co' },
            { code: 'CZK', name: 'Czech Koruna', country: 'Czechia', countryCode: 'cz' },
            { code: 'DKK', name: 'Danish Krone', country: 'Denmark', countryCode: 'dk' },
            { code: 'EGP', name: 'Egyptian Pound', country: 'Egypt', countryCode: 'eg' },
            { code: 'HKD', name: 'Hong Kong Dollar', country: 'Hong Kong', countryCode: 'hk' },
            { code: 'IDR', name: 'Indonesian Rupiah', country: 'Indonesia', countryCode: 'id' },
            { code: 'ILS', name: 'Israeli New Shekel', country: 'Israel', countryCode: 'il' },
            { code: 'KRW', name: 'South Korean Won', country: 'South Korea', countryCode: 'kr' },
            { code: 'MXN', name: 'Mexican Peso', country: 'Mexico', countryCode: 'mx' },
            { code: 'MYR', name: 'Malaysian Ringgit', country: 'Malaysia', countryCode: 'my' },
            { code: 'NOK', name: 'Norwegian Krone', country: 'Norway', countryCode: 'no' },
            { code: 'NZD', name: 'New Zealand Dollar', country: 'New Zealand', countryCode: 'nz' },
            { code: 'PHP', name: 'Philippine Peso', country: 'Philippines', countryCode: 'ph' },
            { code: 'PKR', name: 'Pakistani Rupee', country: 'Pakistan', countryCode: 'pk' },
            { code: 'PLN', name: 'Polish Zloty', country: 'Poland', countryCode: 'pl' },
            { code: 'RUB', name: 'Russian Ruble', country: 'Russia', countryCode: 'ru' },
            { code: 'SAR', name: 'Saudi Riyal', country: 'Saudi Arabia', countryCode: 'sa' },
            { code: 'SEK', name: 'Swedish Krona', country: 'Sweden', countryCode: 'se' },
            { code: 'SGD', name: 'Singapore Dollar', country: 'Singapore', countryCode: 'sg' },
            { code: 'THB', name: 'Thai Baht', country: 'Thailand', countryCode: 'th' },
            { code: 'TRY', name: 'Turkish Lira', country: 'Turkey', countryCode: 'tr' },
            { code: 'TWD', name: 'New Taiwan Dollar', country: 'Taiwan', countryCode: 'tw' },
            { code: 'VND', name: 'Vietnamese Dong', country: 'Vietnam', countryCode: 'vn' },
            { code: 'ZAR', name: 'South African Rand', country: 'South Africa', countryCode: 'za' }
        ];

        /**
         * APP STATE
         */
        const state = {
            rates: {},
            lastUpdated: null,
            from: 'USD',
            to: 'EUR',
            amount: 1,
            precision: 4,
            favorites: JSON.parse(localStorage.getItem('fav_currencies') || '[]'),
            recent: JSON.parse(localStorage.getItem('recent_currencies') || '[]'),
            selectingFor: null, // 'from' or 'to'
            theme: localStorage.getItem('theme') || 'light'
        };

        const API_PRIMARY = "https://open.er-api.com/v6/latest/USD";
        const FALLBACK_RATES = { "USD": 1, "EUR": 0.92, "GBP": 0.79, "INR": 83.3, "JPY": 150.5 }; // Minimal hardcoded fallback

        /**
         * CORE LOGIC
         */
        function init() {
            setTheme(state.theme);
            loadSavedState();
            setupEventListeners();
            fetchRates();
            renderSelectors();
            
            // IntersectionObserver for lazy loading flags
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        observer.unobserve(img);
                    }
                });
            });
            window.flagObserver = observer;
        }

        async function fetchRates(isManual = false) {
            updateOnlineStatus(navigator.onLine);
            const badge = document.getElementById('lastUpdated');
            if(isManual) badge.innerText = "Syncing...";

            try {
                // Check cache first if not manual
                const cached = localStorage.getItem('exchange_rates');
                const cacheTime = localStorage.getItem('rates_timestamp');
                if (!isManual && cached && cacheTime && (Date.now() - cacheTime < 12 * 60 * 60 * 1000)) {
                    state.rates = JSON.parse(cached);
                    state.lastUpdated = new Date(parseInt(cacheTime));
                    finalizeFetch();
                    return;
                }

                const response = await fetch(API_PRIMARY);
                if (!response.ok) throw new Error("API Failed");
                const data = await response.json();
                
                state.rates = data.rates;
                state.lastUpdated = new Date();
                
                // Cache
                localStorage.setItem('exchange_rates', JSON.stringify(state.rates));
                localStorage.setItem('rates_timestamp', Date.now().toString());
                finalizeFetch();

            } catch (err) {
                console.error("Rate fetch error:", err);
                if (!Object.keys(state.rates).length) {
                    state.rates = FALLBACK_RATES;
                    state.lastUpdated = new Date();
                }
                finalizeFetch();
                showToast("Connection issues. Using cached/offline rates.");
            }
        }

        function finalizeFetch() {
            document.getElementById('lastUpdated').innerText = `Last updated: ${state.lastUpdated.toLocaleTimeString()}`;
            calculate('from');
        }

        function calculate(source) {
            const fromRate = state.rates[state.from] || 1;
            const toRate = state.rates[state.to] || 1;
            const precision = parseInt(state.precision);

            if (source === 'from') {
                const amount = parseFloat(document.getElementById('inputFrom').value) || 0;
                const result = (amount / fromRate) * toRate;
                const inputTo = document.getElementById('inputTo');
                inputTo.value = result.toFixed(precision);
                animateGlow(inputTo);
            } else {
                const amount = parseFloat(document.getElementById('inputTo').value) || 0;
                const result = (amount / toRate) * fromRate;
                const inputFrom = document.getElementById('inputFrom');
                inputFrom.value = result.toFixed(precision);
                animateGlow(inputFrom);
            }
        }

        function animateGlow(el) {
            el.classList.remove('glow-effect');
            void el.offsetWidth; // trigger reflow
            el.classList.add('glow-effect');
        }

        function swapCurrencies() {
            const temp = state.from;
            state.from = state.to;
            state.to = temp;
            
            const card = document.querySelector('.main-card');
            card.style.transition = "transform 0.4s ease";
            card.style.transform = "scale(0.98)";
            
            setTimeout(() => {
                renderSelectors();
                calculate('from');
                card.style.transform = "scale(1)";
            }, 200);
        }

        /**
         * UI COMPONENTS & HANDLERS
         */
        function renderSelectors() {
            const fromData = ALL_CURRENCIES.find(c => c.code === state.from);
            const toData = ALL_CURRENCIES.find(c => c.code === state.to);

            document.getElementById('codeFrom').innerText = fromData.code;
            document.getElementById('nameFrom').innerText = fromData.name;
            document.getElementById('flagFrom').innerHTML = `<img src="https://flagcdn.com/w80/${fromData.countryCode}.png" alt="">`;

            document.getElementById('codeTo').innerText = toData.code;
            document.getElementById('nameTo').innerText = toData.name;
            document.getElementById('flagTo').innerHTML = `<img src="https://flagcdn.com/w80/${toData.countryCode}.png" alt="">`;
        }

        function openSelector(type) {
            state.selectingFor = type;
            const overlay = document.getElementById('selectorOverlay');
            overlay.classList.add('active');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchInput').focus();
            filterList('');
        }

        function closeSelector(e) {
            if (e && e.target !== document.getElementById('selectorOverlay')) return;
            document.getElementById('selectorOverlay').classList.remove('active');
        }

        function filterList(query) {
            const container = document.getElementById('listViewport');
            container.innerHTML = '';
            const normalizedQuery = query.toLowerCase().trim();

            const filtered = ALL_CURRENCIES.filter(c => 
                c.code.toLowerCase().includes(normalizedQuery) ||
                c.name.toLowerCase().includes(normalizedQuery) ||
                c.country.toLowerCase().includes(normalizedQuery)
            );

            // Virtualization logic simplified for this demo: render what matches
            // In a production app, we'd use a fixed-height container and only render visible rows.
            filtered.forEach(curr => {
                const isFav = state.favorites.includes(curr.code);
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div class="flag-circle">
                        <img class="lazy-flag" data-src="https://flagcdn.com/w80/${curr.countryCode}.png" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                    </div>
                    <div class="selector-text">
                        <span class="currency-code">${curr.code}</span>
                        <span class="currency-name">${curr.name} • ${curr.country}</span>
                    </div>
                    <button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${curr.code}')">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </button>
                `;
                item.onclick = () => selectCurrency(curr.code);
                container.appendChild(item);
                window.flagObserver.observe(item.querySelector('.lazy-flag'));
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--text-muted)">No currencies found.</div>`;
            }
        }

        function selectCurrency(code) {
            if (state.selectingFor === 'from') state.from = code;
            else state.to = code;
            
            renderSelectors();
            calculate('from');
            closeSelector();
            
            // Handle Recents
            state.recent = [code, ...state.recent.filter(c => c !== code)].slice(0, 5);
            localStorage.setItem('recent_currencies', JSON.stringify(state.recent));
        }

        function toggleFavorite(e, code) {
            e.stopPropagation();
            if (state.favorites.includes(code)) {
                state.favorites = state.favorites.filter(c => c !== code);
            } else {
                state.favorites.push(code);
            }
            localStorage.setItem('fav_currencies', JSON.stringify(state.favorites));
            filterList(document.getElementById('searchInput').value);
        }

        /**
         * UTILS
         */
        function setTheme(theme) {
            state.theme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }

        function setupEventListeners() {
            document.getElementById('inputFrom').addEventListener('input', () => calculate('from'));
            document.getElementById('inputTo').addEventListener('input', () => calculate('to'));
            
            document.getElementById('searchInput').addEventListener('input', (e) => {
                // Simple debounce
                clearTimeout(this.searchTimeout);
                this.searchTimeout = setTimeout(() => filterList(e.target.value), 300);
            });

            document.getElementById('precisionSelect').addEventListener('change', (e) => {
                state.precision = e.target.value;
                calculate('from');
            });

            document.getElementById('themeToggle').onclick = () => {
                setTheme(state.theme === 'light' ? 'dark' : 'light');
            };

            window.addEventListener('online', () => updateOnlineStatus(true));
            window.addEventListener('offline', () => updateOnlineStatus(false));

            // Keyboard Shortcuts
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    openSelector('from');
                }
                if (e.key === 'Escape') closeSelector();
            });
        }

        function updateOnlineStatus(online) {
            const badge = document.getElementById('onlineBadge');
            badge.className = `status-badge ${online ? 'status-online' : 'status-offline'}`;
            badge.innerHTML = `<span style="display:inline-block; width:6px; height:6px; background:currentColor; border-radius:50%"></span> ${online ? 'Online' : 'Offline'}`;
        }

        function copyResult() {
            const val = document.getElementById('inputTo').value;
            const text = `${document.getElementById('inputFrom').value} ${state.from} = ${val} ${state.to}`;
            
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("Copied to clipboard!");
        }

        function shareResult() {
            if (navigator.share) {
                navigator.share({
                    title: 'Currency Conversion',
                    text: `${document.getElementById('inputFrom').value} ${state.from} is ${document.getElementById('inputTo').value} ${state.to}`
                });
            } else {
                showToast("Sharing not supported on this browser.");
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.style = `position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text-main); color:var(--bg-color); padding:0.75rem 1.5rem; border-radius:2rem; font-size:0.9rem; z-index:2000; box-shadow:var(--shadow); transition: opacity 0.3s;`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function loadSavedState() {
            // Restore from localStorage if needed
        }

        // Initialize App
        window.onload = init;

    </script>
