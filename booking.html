<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Consultation - FinancePro</title>
    <meta name="description" content="Schedule your free consultation with our financial experts. Choose your preferred date and time.">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="nav">
        <div class="nav__container">
            <a href="/" class="nav__logo">
                <img src="/images/logo.svg" alt="FinancePro" width="120" height="40">
            </a>
            <button class="nav__toggle" aria-label="Toggle navigation">
                <span class="nav__toggle-line"></span>
                <span class="nav__toggle-line"></span>
                <span class="nav__toggle-line"></span>
            </button>
            <ul class="nav__menu">
                <li><a href="/" class="nav__link">Home</a></li>
                <li><a href="/services.html" class="nav__link">Services</a></li>
                <li><a href="/resources.html" class="nav__link">Resources</a></li>
                <li><a href="/contact.html" class="nav__link">Contact</a></li>
                <li><a href="/booking.html" class="nav__link nav__link--active nav__link--cta">Book Consultation</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="padding-top: 6rem; padding-bottom: 6rem;">
        <div class="services-preview__header">
            <h1 class="services-preview__title">Book Your Free Consultation</h1>
            <p class="services-preview__subtitle">
                Schedule a personalized session with our financial experts
            </p>
        </div>

        <div style="max-width: 800px; margin: 0 auto;">
            <form id="booking-form" class="booking-form">
                <div class="form-group">
                    <label class="form-label" for="service">Service Interest</label>
                    <select class="form-select" id="service" name="service" required>
                        <option value="">Select a service</option>
                        <option value="financial-planning">Financial Planning</option>
                        <option value="investment-guidance">Investment Guidance</option>
                        <option value="tax-management">Tax Management</option>
                        <option value="business-loans">Business Loans</option>
                        <option value="general-consultation">General Consultation</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" class="form-input" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-input" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" class="form-input" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="company">Company Name</label>
                    <input type="text" class="form-input" id="company" name="company">
                </div>

                <div class="form-group">
                    <label class="form-label" for="preferred-date">Preferred Date</label>
                    <input type="date" class="form-input" id="preferred-date" name="preferred-date" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="preferred-time">Preferred Time</label>
                    <select class="form-select" id="preferred-time" name="preferred-time" required>
                        <option value="">Select time</option>
                        <option value="09:00">9:00 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="14:00">2:00 PM</option>
                        <option value="15:00">3:00 PM</option>
                        <option value="16:00">4:00 PM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="message">Additional Information</label>
                    <textarea class="form-textarea" id="message" name="message" placeholder="Tell us about your financial goals and any specific questions you have..."></textarea>
                </div>

                <div class="form-group">
                    <div class="form-checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Subscribe to our newsletter for financial tips and updates</label>
                    </div>
                </div>

                <button type="submit" class="btn btn--primary btn--large" style="width: 100%;">
                    Book Free Consultation
                </button>
            </form>
        </div>
    </main>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/booking.js"></script>
</body>
</html>
