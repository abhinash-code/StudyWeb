<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Shayri Magic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --danger: #ef4444; --bg: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 20px; color: #1e293b; display: flex; justify-content: space-between; align-items: center; }
        
        .login-screen { position: fixed; inset: 0; background: white; z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
        
        .stats { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: #eff6ff; padding: 1rem; border-radius: 8px; flex: 1; text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        
        .bulk-add { margin-bottom: 2rem; border: 1px dashed #cbd5e1; padding: 1.5rem; border-radius: 8px; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin: 10px 0; font-family: inherit; }
        
        .list-header { font-weight: 600; padding: 10px; border-bottom: 2px solid #e2e8f0; display: grid; grid-template-columns: 1fr 150px; }
        .item { padding: 15px; border-bottom: 1px solid #f1f5f9; display: grid; grid-template-columns: 1fr 150px; align-items: center; gap: 10px; }
        .item:hover { background: #f8fafc; }
        .item-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn { padding: 8px 16px; border-radius: 6px; cursor: pointer; border: none; font-weight: 500; font-size: 0.85rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-ghost { background: transparent; color: #64748b; border: 1px solid #e2e8f0; }

        .input-group { width: 100%; max-width: 300px; }
        input { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; }
        
        [v-cloak] { display: none; }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <h2>Admin Authentication</h2>
        <div class="input-group">
            <input type="password" id="adminPass" placeholder="Enter password...">
        </div>
        <button class="btn btn-primary" id="loginBtn">Unlock Dashboard</button>
    </div>

    <div class="container">
        <h1>
            Control Center
            <span id="totalCount" style="font-size: 0.9rem; font-weight: 400; color: #64748b;">Loading...</span>
        </h1>

        <div class="bulk-add">
            <h3>Quick Add / Bulk Import</h3>
            <p style="font-size: 0.8rem; color: #64748b;">Paste multiple shayris here. Each line will be a new entry.</p>
            <textarea id="bulkInput" placeholder="Enter text here..."></textarea>
            <button class="btn btn-primary" id="addBtn">Save to Database</button>
        </div>

        <div class="list-container">
            <div class="list-header">
                <div>Content Preview</div>
                <div>Actions</div>
            </div>
            <div id="adminList">
                <!-- Items populated here -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjaxVe6vWWyIFGXU2sTrYBVaPcNut5p-E",
            authDomain: "shayri-937eb.firebaseapp.com",
            projectId: "shayri-937eb",
            storageBucket: "shayri-937eb.firebasestorage.app",
            messagingSenderId: "901857704654",
            appId: "1:901857704654:web:3b3019ee60675a3accae9f",
            measurementId: "G-R4MFJ6X91B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "shayri");

        // Simple auth check (Note: client-side for simplicity)
        document.getElementById('loginBtn').addEventListener('click', () => {
            if (document.getElementById('adminPass').value === 'admin123') {
                document.getElementById('loginScreen').style.display = 'none';
            } else {
                alert('Invalid Password');
            }
        });

        const listContainer = document.getElementById('adminList');
        const countDisplay = document.getElementById('totalCount');

        // Real-time Dashboard Sync
        const q = query(colRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            countDisplay.textContent = `Total: ${snapshot.size} items`;
            const fragment = document.createDocumentFragment();
            listContainer.innerHTML = '';

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const id = docSnap.id;

                const row = document.createElement('div');
                row.className = 'item';
                row.innerHTML = `
                    <div class="item-text" id="text-${id}">${data.text}</div>
                    <div style="display:flex; gap:5px;">
                        <button class="btn btn-ghost edit-btn" data-id="${id}">Edit</button>
                        <button class="btn btn-danger del-btn" data-id="${id}">Delete</button>
                    </div>
                `;
                fragment.appendChild(row);
            });
            listContainer.appendChild(fragment);
        });

        // Bulk Add Logic
        document.getElementById('addBtn').addEventListener('click', async () => {
            const input = document.getElementById('bulkInput').value.trim();
            if (!input) return;

            const lines = input.split('\n').filter(l => l.trim() !== '');
            const btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            for (const line of lines) {
                await addDoc(colRef, {
                    text: line.trim(),
                    createdAt: new Date()
                });
            }

            document.getElementById('bulkInput').value = '';
            btn.disabled = false;
            btn.textContent = 'Save to Database';
        });

        // Actions Logic
        document.addEventListener('click', async (e) => {
            const id = e.target.dataset.id;
            
            if (e.target.classList.contains('del-btn')) {
                if(confirm('Are you sure you want to delete this?')) {
                    await deleteDoc(doc(db, "shayri", id));
                }
            }

            if (e.target.classList.contains('edit-btn')) {
                const currentText = document.getElementById(`text-${id}`).innerText;
                const newText = prompt("Edit Shayri:", currentText);
                if (newText && newText !== currentText) {
                    await updateDoc(doc(db, "shayri", id), { text: newText });
                }
            }
        });
    </script>
</body>
</html>
